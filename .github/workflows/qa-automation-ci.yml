name: QA Automation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: insurance_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Initialize insurance database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -p"$DB_PASSWORD" < database-testing/01-database-setup.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -p"$DB_PASSWORD" < database-testing/02-test-data.sql

      - name: Run Maven tests
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn clean test

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: selenium-java-framework/screenshots/
          if-no-files-found: ignore

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: selenium-java-framework/reports/
          if-no-files-found: warn